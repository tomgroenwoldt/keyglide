name: Bug report
description: Something is broken
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security issue, please **do not**
        file it here — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Press ...
        3. See ...
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where did you hit this?
      options:
        - keygli.de
        - A local development setup
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - The editor / terminal
        - Leaderboard or scores
        - Browsing or submitting challenges
        - Login
        - Something else / not sure
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 142 on Arch Linux

  - type: textarea
    id: logs
    attributes:
      label: Console or server logs
      description: Anything from the browser console or the service logs.
      render: shell
